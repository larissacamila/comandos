<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Passageiro - Rota Brasil</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
padding:20px;
background:#111827;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

.card{
background:#1f2937;
padding:20px;
border-radius:15px;
margin-bottom:15px;
}

input{
width:100%;
padding:15px;
margin-bottom:10px;
border:none;
border-radius:10px;
background:#111827;
color:white;
outline:none;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
font-size:16px;
}

.primary{
background:#2563eb;
color:white;
}

.success{
background:#10b981;
color:white;
}

.danger{
background:#ef4444;
color:white;
}

.motorista{
background:#111827;
padding:12px;
border-radius:12px;
margin-top:10px;
border:1px solid #374151;
}

iframe{
width:100%;
height:300px;
border:none;
border-radius:15px;
margin-top:15px;
}

</style>

</head>

<body>

<header>
🚗 Rota Brasil
</header>

<div class="container">

<!-- LOGIN -->

<div
class="card"
id="loginCard">

<h3>
Login / Cadastro
</h3>

<input
id="nome"
placeholder="Nome">

<input
id="email"
placeholder="Email">

<input
id="senha"
type="password"
placeholder="Senha">

<input
id="telefone"
placeholder="Telefone">

<button
class="primary"
onclick="register()">

Criar conta

</button>

<button
class="success"
onclick="login()">

Entrar

</button>

</div>

<!-- DASHBOARD -->

<div
class="card"
id="dashboard"
style="display:none">

<h3>
Para onde vamos?
</h3>

<input
id="destino"
placeholder="Digite o destino">

<button
class="primary"
onclick="chamarCorrida()">

Procurar motorista

</button>

<button
class="danger"
onclick="cancelarCorrida()">

Cancelar corrida

</button>

<div id="corridaStatus"></div>

<div id="mapaMotorista"></div>

</div>

</div>

<script>

const API =
"https://rotabrasil-v1cf.onrender.com";

const socket =
io(API);

let user = null;

let corridaId = null;

let motoristaAtual = null;

/* =========================
   AUTO LOGIN
========================= */

const userSalvo =
localStorage.getItem(
"user"
);

if(userSalvo){

user =
JSON.parse(userSalvo);

window.addEventListener(
"load",
()=>{

document.getElementById(
"loginCard"
).style.display =
"none";

document.getElementById(
"dashboard"
).style.display =
"block";

}
);

}

/* =========================
   REGISTER
========================= */

async function register(){

await fetch(
API+"/register",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

nome:
document.getElementById(
"nome"
).value,

email:
document.getElementById(
"email"
).value,

senha:
document.getElementById(
"senha"
).value,

telefone:
document.getElementById(
"telefone"
).value,

tipo:"passageiro"

})

}

);

alert(
"Conta criada"
);

}

/* =========================
   LOGIN
========================= */

async function login(){

const res =
await fetch(
API+"/login",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:
document.getElementById(
"email"
).value,

senha:
document.getElementById(
"senha"
).value

})

}

);

const data =
await res.json();

if(data.token){

user =
data.user;

localStorage.setItem(
"user",
JSON.stringify(user)
);

localStorage.setItem(
"token",
data.token
);

document.getElementById(
"loginCard"
).style.display =
"none";

document.getElementById(
"dashboard"
).style.display =
"block";

}else{

alert(
"Erro login"
);

}

}

/* =========================
   CHAMAR CORRIDA
========================= */

async function chamarCorrida(){

if(!navigator.geolocation){

alert(
"GPS não suportado"
);

return;

}

const destino =
document.getElementById(
"destino"
).value;

if(!destino){

alert(
"Digite o destino"
);

return;

}

navigator.geolocation.getCurrentPosition(

async(pos)=>{

try{

const latitude =
pos.coords.latitude;

const longitude =
pos.coords.longitude;

const origem =
`${latitude},${longitude}`;

const res =
await fetch(
API+"/nova_corrida",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

passageiro_id:
user.id,

origem:
origem,

destino:
destino,

valor:0

})

}

);

const data =
await res.json();

console.log(data);

corridaId =
data.corrida_id;

document.getElementById(
"corridaStatus"
).innerHTML = `

<div class="motorista">

🔎 Procurando motorista...

</div>

`;

}catch(err){

console.log(err);

alert(
"Erro ao chamar corrida"
);

}

},

(error)=>{

alert(
"Ative a localização"
);

},

{

enableHighAccuracy:true,
timeout:10000,
maximumAge:0

}

);

}

/* =========================
   CANCELAR
========================= */

async function cancelarCorrida(){

if(!corridaId){
return;
}

await fetch(
API+"/cancelar_corrida/"+corridaId,
{
method:"POST"
}
);

document.getElementById(
"corridaStatus"
).innerHTML = `

<div class="motorista">

❌ Corrida cancelada

</div>

`;

document.getElementById(
"mapaMotorista"
).innerHTML = "";

corridaId = null;

}

/* =========================
   MOTORISTA ACEITOU
========================= */

socket.on(
"corrida_aceita",
(data)=>{

if(
data.corrida_id !=
corridaId
){
return;
}

motoristaAtual =
data.motorista_id;

document.getElementById(
"corridaStatus"
).innerHTML = `

<div class="motorista">

<h3>
🚗 Motorista a caminho
</h3>

<p>
👨 ${data.motorista_nome}
</p>

<p>
🚘 ${data.carro}
</p>

<p>
📍 ${data.placa}
</p>

</div>

`;

}
);

/* =========================
   LOCALIZAÇÃO MOTORISTA
========================= */

socket.on(
"localizacao_motorista",
(data)=>{

if(
data.motorista_id !=
motoristaAtual
){
return;
}

document.getElementById(
"mapaMotorista"
).innerHTML = `

<iframe

src="https://maps.google.com/maps?q=${data.latitude},${data.longitude}&z=15&output=embed"

>

</iframe>

`;

}
);

/* =========================
   CANCELAMENTO
========================= */

socket.on(
"corrida_cancelada",
(data)=>{

if(
data.corrida_id !=
corridaId
){
return;
}

document.getElementById(
"corridaStatus"
).innerHTML = `

<div class="motorista">

❌ Corrida cancelada

</div>

`;

document.getElementById(
"mapaMotorista"
).innerHTML = "";

corridaId = null;

}
);

</script>

</body>
</html>
