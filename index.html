<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Rota Brasil</title>
</head>
<body style="padding: 20px; font-family: sans-serif;">

    <h2>Painel do Motorista</h2>

    <botao-deslizar 
        id="btn-iniciar" 
        texto="INICIAR ROTA" 
        texto-sucesso="ROTA EM ANDAMENTO">
    </botao-deslizar>

    <botao-deslizar 
        id="btn-finalizar" 
        texto="FINALIZAR VIAGEM" 
        texto-sucesso="VIAGEM ENCERRADA"
        cor="#d32f2f"> </botao-deslizar>

    <script src="seu-arquivo-componente.js"></script>
    
    <script>
        // Como capturar a ação de cada botão no seu aplicativo:
        const btnIniciar = document.getElementById('btn-iniciar');
        const btnFinalizar = document.getElementById('btn-finalizar');

        // Escuta o evento 'confirmado' que nós criamos no componente
        btnIniciar.addEventListener('confirmado', () => {
            console.log("Ação: Abrindo o mapa e iniciando a rota...");
            // Coloque o código do seu app aqui!
        });

        btnFinalizar.addEventListener('confirmado', () => {
            console.log("Ação: Calculando o valor da corrida e encerrando...");
            // Coloque o código do seu app aqui!
        });
    </script>
</body>
</html>
