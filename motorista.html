<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Motorista - Rota Brasil</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
        body { background:#f5f5f5; padding:15px; }
        .container { max-width:900px; margin:0 auto; }
        .cabecalho { background:#2c3e50; color:white; padding:15px; border-radius:8px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
        .card { background:white; padding:20px; border-radius:8px; margin-bottom:15px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
        .btn { padding:10px 15px; border:none; border-radius:5px; cursor:pointer; font-weight:bold; margin:5px; }
        .btn-verde { background:#27ae60; color:white; }
        .btn-vermelho { background:#e74c3c; color:white; }
        .btn-azul { background:#2980b9; color:white; }
        .status { padding:8px; border-radius:5px; font-weight:bold; margin-bottom:10px; }
        .online { background:#d4edda; color:#155724; }
        .offline { background:#f8d7da; color:#721c24; }
        .chamada { border-left:4px solid #f39c12; padding-left:15px; margin:10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Cabeçalho -->
        <div class="cabecalho">
            <h2>🚗 Painel do Motorista</h2>
            <div>
                <span id="statusConexao" class="status offline">Desconectado</span>
                <button id="btnSair" class="btn btn-vermelho" style="display:none;">Sair</button>
            </div>
        </div>

        <!-- Área de Login -->
        <div id="areaLogin" class="card">
            <h3>🔐 Acessar</h3>
            <input type="email" id="email" placeholder="Seu e-mail" style="width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px;">
            <input type="password" id="senha" placeholder="Sua senha" style="width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px;">
            <button id="btnEntrar" class="btn btn-verde">Entrar</button>
        </div>

        <!-- Área Principal -->
        <div id="areaPrincipal" style="display:none;">
            <div class="card">
                <p><strong>Nome:</strong> <span id="nomeMotorista"></span></p>
                <button id="btnFicarOnline" class="btn btn-verde">Ficar Online</button>
                <button id="btnFicarOffline" class="btn btn-vermelho">Ficar Offline</button>
            </div>

            <!-- Novas Corridas -->
            <div class="card">
                <h3>📞 Novas Chamadas</h3>
                <div id="listaCorridas"></div>
            </div>

            <!-- Corrida Ativa -->
            <div id="corridaAtiva" class="card" style="display:none; border-left:5px solid #27ae60;">
                <h3>✅ Corrida Aceita</h3>
                <p><strong>Origem:</strong> <span id="origemAtiva"></span></p>
                <p><strong>Destino:</strong> <span id="destinoAtiva"></span></p>
                <p><strong>Valor:</strong> R$ <span id="valorAtiva"></span></p>
                <button id="btnIniciar" class="btn btn-azul">Iniciar Viagem</button>
                <button id="btnFinalizar" class="btn btn-verde">Finalizar Corrida</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ COLOQUE AQUI O SEU ENDEREÇO DO RENDER
        const API_URL = "https://rotabrasil-5jcp.onrender.com"; 
        const SOCKET_URL = API_URL;

        let token = "";
        let motoristaId = "";
        let corridaAtual = null;
        let socket = null;

        // Elementos
        const areaLogin = document.getElementById("areaLogin");
        const areaPrincipal = document.getElementById("areaPrincipal");
        const btnEntrar = document.getElementById("btnEntrar");
        const btnSair = document.getElementById("btnSair");
        const btnFicarOnline = document.getElementById("btnFicarOnline");
        const btnFicarOffline = document.getElementById("btnFicarOffline");
        const listaCorridas = document.getElementById("listaCorridas");
        const corridaAtivaEl = document.getElementById("corridaAtiva");
        const statusConexao = document.getElementById("statusConexao");

        // 📡 CONECTAR SOCKET
        function conectarSocket() {
            socket = io(SOCKET_URL, { transports: ["websocket", "polling"] });

            socket.on("connect", () => {
                statusConexao.textContent = "Conectado";
                statusConexao.className = "status online";
            });

            socket.on("disconnect", () => {
                statusConexao.textContent = "Desconectado";
                statusConexao.className = "status offline";
            });

            // ✅ RECEBER NOVA CORRIDA — MESMO NOME DO BACKEND
            socket.on("nova_corrida", (dados) => {
                if (!corridaAtual) {
                    const div = document.createElement("div");
                    div.className = "chamada";
                    div.id = `corrida-${dados.corrida_id}`;
                    div.innerHTML = `
                        <p><strong>Passageiro:</strong> ${dados.passageiro_nome}</p>
                        <p><strong>Origem:</strong> ${dados.origem}</p>
                        <p><strong>Destino:</strong> ${dados.destino}</p>
                        <p><strong>Valor:</strong> R$ ${dados.valor.toFixed(2)}</p>
                        <button onclick="aceitarCorrida(${dados.corrida_id})" class="btn btn-verde">Aceitar</button>
                    `;
                    listaCorridas.appendChild(div);
                }
            });

            // ✅ CORRIDA ACEITA — ENTRA NA SALA
            socket.on("corrida_aceita", (dados) => {
                socket.emit("entrar_na_sala", { corrida_id: dados.corrida_id });
                corridaAtual = dados;
                mostrarCorridaAtiva(dados);
                removerCorridaDaLista(dados.corrida_id);
            });

            // ✅ CORRIDA CANCELADA
            socket.on("corrida_cancelada", (dados) => {
                alert("❌ Corrida cancelada pelo passageiro!");
                removerCorridaDaLista(dados.corrida_id);
                if (corridaAtual && corridaAtual.corrida_id === dados.corrida_id) {
                    corridaAtual = null;
                    corridaAtivaEl.style.display = "none";
                }
            });

            // ✅ VIAGEM INICIADA
            socket.on("viagem_iniciada", (dados) => {
                alert("🚀 Viagem iniciada!");
            });

            // ✅ VIAGEM FINALIZADA
            socket.on("viagem_finalizada", (dados) => {
                alert("🏁 Corrida finalizada! Valor: R$ " + dados.valor.toFixed(2));
                corridaAtual = null;
                corridaAtivaEl.style.display = "none";
            });

            // ✅ ATUALIZAÇÃO DE LOCALIZAÇÃO
            socket.on("atualizacao_localizacao", (dados) => {
                // Recebe posição — pode usar no mapa
                console.log("Posição recebida:", dados);
            });
        }

        // 🔐 LOGIN
        btnEntrar.addEventListener("click", async () => {
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, senha })
                });
                const dados = await res.json();

                if (dados.token) {
                    token = dados.token;
                    motoristaId = dados.user.id;
                    document.getElementById("nomeMotorista").textContent = dados.user.nome;
                    areaLogin.style.display = "none";
                    areaPrincipal.style.display = "block";
                    btnSair.style.display = "inline-block";
                    conectarSocket();
                } else {
                    alert(dados.erro || "Erro ao entrar");
                }
            } catch (e) {
                alert("Erro de conexão: " + e);
            }
        });

        // 📌 ACEITAR CORRIDA
        async function aceitarCorrida(id) {
            try {
                const res = await fetch(`${API_URL}/aceitar_corrida/${id}`, {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Content-Type": "application/json"
                    }
                });
                const dados = await res.json();
                if (!dados.sucesso) alert(dados.erro);
            } catch (e) {
                alert("Erro: " + e);
            }
        }

        // 🚀 INICIAR VIAGEM
        document.getElementById("btnIniciar").addEventListener("click", () => {
            if (corridaAtual) {
                socket.emit("iniciar_viagem", { corrida_id: corridaAtual.corrida_id });
            }
        });

        // 🏁 FINALIZAR CORRIDA
        document.getElementById("btnFinalizar").addEventListener("click", async () => {
            if (!corridaAtual) return;
            try {
                await fetch(`${API_URL}/finalizar_corrida/${corridaAtual.corrida_id}`, {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ valor: corridaAtual.valor })
                });
            } catch (e) {
                alert("Erro: " + e);
            }
        });

        // 🟢🔴 STATUS ONLINE/OFFLINE
        btnFicarOnline.addEventListener("click", async () => {
            await fetch(`${API_URL}/ficar_online/${motoristaId}`, { method: "POST" });
            alert("✅ Você está ONLINE");
        });
        btnFicarOffline.addEventListener("click", async () => {
            await fetch(`${API_URL}/ficar_offline/${motoristaId}`, { method: "POST" });
            alert("🔴 Você está OFFLINE");
        });

        // 🧩 FUNÇÕES AUXILIARES
        function mostrarCorridaAtiva(dados) {
            document.getElementById("origemAtiva").textContent = dados.origem;
            document.getElementById("destinoAtiva").textContent = dados.destino;
            document.getElementById("valorAtiva").textContent = dados.valor.toFixed(2);
            corridaAtivaEl.style.display = "block";
        }
        function removerCorridaDaLista(id) {
            const el = document.getElementById(`corrida-${id}`);
            if (el) el.remove();
        }

        // 🚪 SAIR
        btnSair.addEventListener("click", () => {
            token = ""; motoristaId = ""; corridaAtual = null;
            if (socket) socket.disconnect();
            areaLogin.style.display = "block";
            areaPrincipal.style.display = "none";
            btnSair.style.display = "none";
            listaCorridas.innerHTML = "";
        });
    </script>
</body>
</html>
