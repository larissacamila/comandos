<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ADM - Rota Brasil</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

.sidebar{
    position:fixed;
    width:220px;
    height:100vh;
    background:#1e293b;
    padding:20px;
}

.sidebar button{
    width:100%;
    margin:8px 0;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#334155;
    color:white;
    cursor:pointer;
}

.content{
    margin-left:240px;
    padding:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin-bottom:15px;
}
</style>
</head>
<body>

<div class="sidebar">

    <h2>🇧🇷 Rota Brasil</h2>

    <button onclick="carregarDashboard()">
        📊 Dashboard
    </button>

    <button onclick="abrirCarteiras()">
        💰 Carteiras
    </button>

    <button onclick="abrirUsuarios()">
        👥 Usuários
    </button>

</div>

<div class="content">

    <div class="card">
        <h3>Usuários</h3>
        <span id="usuarios">0</span>
    </div>

    <div class="card">
        <h3>Corridas</h3>
        <span id="corridas">0</span>
    </div>

    <div class="card">
        <h3>Saldo Total</h3>
        <span id="saldo">R$ 0,00</span>
    </div>

</div>

<script>

const API_URL =
"https://rotabrasil-5jcp.onrender.com";

const token =
localStorage.getItem("token");

async function carregarDashboard(){

    const r = await fetch(
        `${API_URL}/admin/dashboard`,
        {
            headers:{
                Authorization:
                `Bearer ${token}`
            }
        }
    );

    const d = await r.json();

    document.getElementById(
        "usuarios"
    ).textContent =
        d.usuarios;

    document.getElementById(
        "corridas"
    ).textContent =
        d.corridas;

    document.getElementById(
        "saldo"
    ).textContent =
        `R$ ${d.saldo_total.toFixed(2)}`;
}

carregarDashboard();

</script>

</body>
</html>
